services:
  db:
    image: postgres:16-alpine
    container_name: fleet-db
    env_file:
      - fleet.env
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
    volumes:
      - fleet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  fleet:
    build:
      context: .
      dockerfile: fleet.Dockerfile
    image: fleet-panel:latest
    container_name: fleet-panel
    ports:
      - "${FLEET_PORT:-3100}:3100"
    environment:
      FLEET_PORT: 3100
      FLEET_DB: /app/data/fleet.json
      PGHOST: db
      PGUSER: fleet
      PGDATABASE: fleet
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - fleet.env
    volumes:
      - fleet-data:/app/data
      - ./.keys:/app/keys:ro
    restart: unless-stopped

volumes:
  fleet-data:
  fleet-db:
