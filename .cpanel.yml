---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$CPANEL_USER/ghostname/
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp server.js package.json package-lock.json $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/data
    - cd $DEPLOYPATH && /usr/local/bin/npm install --omit=dev
    # Node.js apps restart from cPanel > Setup Node.js App > Restart
    # (tmp/restart.txt only applies to Python/Ruby Passenger apps)
